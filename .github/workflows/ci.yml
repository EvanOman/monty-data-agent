name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: monty-data-agent

    steps:
      - uses: actions/checkout@v4
        with:
          path: monty-data-agent

      # pyproject declares chatkit as a local path dep at ../chatkit/python,
      # so CI checks it out as a workspace sibling.
      - name: Check out chatkit (path dependency)
        uses: actions/checkout@v4
        with:
          repository: EvanOman/chatkit
          path: chatkit

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Lint and type check
        run: |
          just lint
          just format-check
          just type

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          files: monty-data-agent/coverage.xml
          fail_ci_if_error: false
